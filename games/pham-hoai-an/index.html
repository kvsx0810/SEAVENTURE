<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Memory Game - Đại dương</title>
<link rel="stylesheet" href="https://use.typekit.net/err5yxp.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<img src="Image/background.jpg" alt="Background">
<img src="Image/light.png" alt="Light" class="light">
<img src="Image/reu-1.png" alt="Reu 1" class="Reu-1 creature">
<img src="Image/reu-2.png" alt="Reu 2" class="Reu-2 creature">
<img src="Image/rock-3.png" alt="Rock 3" class="Rock-3">
<img src="Image/so.png" alt="So" class="So creature">
<img src="Image/crab-1.png" alt="Crab 1" class="Crab-1 creature">
<img src="Image/reu.png" alt="Reu" class="Reu">
<img src="Image/sanho.png" alt="Sanho" class="Sanho creature">
<img src="Image/rock-2.png" alt="Rock 2" class="Rock-2">
<img src="Image/reu4-1.png" alt="Reu 4-1" class="Reu4-1">
<img src="Image/reu4.png" alt="Reu 4" class="Reu4">
<img src="Image/reu2.png" alt="Reu 2" class="Reu2 creature">
<img src="Image/rock-1.png" alt="Rock 1" class="Rock-1">
<img src="Image/sanho3.png" alt="Sanho 3" class="Sanho3 creature">
<img src="Image/rock.png" alt="Rock" class="Rock">
<img src="Image/crab.png" alt="Crab" class="Crab creature">
<img src="Image/reu-2.png" alt="Reu 2" class="Reu-2 creature">


<div class="ph-bar-container hidden" id="phBarContainer">
  <div class="ph-label">pH</div>
  <div class="ph-bar">
    <div class="ph-fill" id="phFill"></div>
  </div>
</div>


<div class="bggame hidden" id="bggame">
  <img src="Image/bggame.png" alt="Background Game" class="bggame-img">
  <div class="card-grid" id="cardGrid"></div>
</div>


<div class="start-screen" id="startScreen">
  <img src="Image/start.png" alt="Start" class="start-btn" id="startBtn">
</div>

<script src="sketch.js"></script>
</body>
</html>
