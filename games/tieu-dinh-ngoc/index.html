<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>Coral Reef</title>

  <link rel="stylesheet" href="style.css">

  <!-- Google Fonts (Inter Black + Alata, used by the "reef has gone silent" banner) -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@900&display=swap">

  <!-- p5.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/p5.min.js"
  ></script>

  <!-- p5.sound (adds loadSound/SoundFile, needed for the ambient + one-shot sounds) -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.3/addons/p5.sound.min.js"
  ></script>

  <!-- Your JS -->
  <script src="sketch.js" defer></script>
</head>

<body>

  <div id="scene">

    <!-- BACKGROUND -->
    <img
      class="background"
      src="assets/images/background.png"
      alt=""
    >

    <!-- SOUND TOGGLE (browsers block audio until the user interacts once) -->
    <button id="sound-toggle" type="button" aria-pressed="false" aria-label="Toggle sound">
      <img id="sound-toggle-icon" src="assets/images/speaker-x.svg" alt="">
    </button>

  </div>

  <!-- Scales #scene to whatever the largest size is that still fits the
       viewport while keeping its 1920x1080 (16:9) box intact — so the page
       never has to scroll or letterbox, it just shrinks/grows as one piece.
       Plain JS, independent of p5 (which only draws inside the already-sized
       canvas) so it also applies before/without the p5 script ever loading. -->
  <script>
    function fitScene() {
      var scene = document.getElementById("scene");
      var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
      scene.style.transform = "translate(-50%, -50%) scale(" + scale + ")";
    }
    window.addEventListener("resize", fitScene);
    fitScene();
  </script>

</body>
</html>
