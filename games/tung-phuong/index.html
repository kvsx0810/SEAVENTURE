<!DOCTYPE html>
<html lang="en">
  <head>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/p5.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/p5.js/1.11.10/addons/p5.sound.min.js"></script>
    
    
    
    <link rel="stylesheet" type="text/css" href="style.css?v=2">
    <meta charset="utf-8" />

  </head>
  <body>
    <main>
    </main>
    <script src="sketch.js?v=2"></script>
    <!-- fixed 1920x1080 canvas -- scale it to fit whatever viewport it's
         shown in (a full browser window, or a small popup iframe) -->
    <script>
      (function () {
        // setTimeout, not requestAnimationFrame -- rAF can be throttled/
        // paused in an iframe that isn't the actively-rendering tab (e.g.
        // an automation-driven or backgrounded popup), which would leave
        // this polling loop stuck and the canvas never scaled.
        function fitCanvas() {
          var canvas = document.querySelector('canvas');
          if (!canvas) { setTimeout(fitCanvas, 50); return; }
          function apply() {
            var scale = Math.min(window.innerWidth / 1920, window.innerHeight / 1080);
            canvas.style.transform = 'scale(' + scale + ')';
          }
          apply();
          window.addEventListener('resize', apply);
        }
        fitCanvas();
      })();
    </script>
  </body>
</html>
