<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SEAVENTURE - Games</title>
<!-- A page can't force its own browser chrome away -- that's the browser's
     call, not a site's, for the same reason a site can't fake its own URL
     bar. The one thing that's real and in this page's control is: if the
     visitor adds this page to their home screen, these two tags make it
     launch with NO browser chrome at all (full native-app-style
     fullscreen) instead of opening as just another browser tab -- apple-
     mobile-web-app-capable for iOS, mobile-web-app-capable for Android.
     The in-page Fullscreen button below (app.js) is the other half: real
     fullscreen from right inside a normal tab, via the Fullscreen API,
     where the browser actually supports it (mainly Android Chrome --
     iOS Safari doesn't expose it for an arbitrary page). -->
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#021427">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:ital,wght@0,400;0,700;0,900;1,700;1,900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css?v=8">
</head>
<body>

  <div class="page-transition" id="pageTransition" data-transition-mode="arrive" aria-hidden="true">
    <img class="page-transition-mascot" src="../assets/mascot-light.png" alt="" data-mascot="light" style="display:none">
    <img class="page-transition-mascot" src="../assets/mascot-dark.png" alt="" data-mascot="dark">
  </div>

  <!-- Same real screen-clip trace as the main cabinet (Figma node 163:11,
       "Vector 23") -- this is a trimmed sibling of the root index.html
       cabinet, entered from the landing page's START button. Only the
       game-select carousel (random + the 5 games) survives here; all the
       static info slides (title/SDG targets/quote/credit/reference) live
       on the landing page itself now, so they're not duplicated here. -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <clipPath id="seaventureScreenClip" clipPathUnits="objectBoundingBox">
        <path d="M0.716372 0.072818 C0.542292 0.028474 0.403045 0.037152 0.281961 0.07143 C0.264523 0.076366 0.250223 0.098892 0.246347 0.129517 C0.222969 0.314248 0.234411 0.527606 0.247312 0.651549 C0.250686 0.68397 0.26538 0.708487 0.283702 0.713598 C0.468838 0.765238 0.635556 0.739696 0.717803 0.713665 C0.733749 0.708618 0.746661 0.688134 0.750686 0.660244 C0.774236 0.497095 0.771283 0.263819 0.751352 0.126055 C0.747166 0.09712 0.733008 0.077056 0.716372 0.072818 Z" />
      </clipPath>
    </defs>
  </svg>

  <!-- Shown instead of the cabinet on a phone held in portrait -- the
       cabinet's own composition is a fixed 1920x1080 (16:9) machine that
       covers the viewport (see .slide in styles.css), so a portrait phone
       would crop it down to an unusable sliver instead of shrinking it
       sensibly. Same "ask for landscape" approach games/tuan-hung and
       Ngọc's reeflect.2 both use for the same reason, kept text-only here
       (no spinning phone icon/asset) to match this shell's own plainer,
       on-brand look instead of borrowing another game's art. -->
  <div id="rotate-prompt" hidden>
    <svg id="rotate-icon" viewBox="0 0 60 100" aria-hidden="true">
      <rect x="4" y="4" width="52" height="92" rx="10" fill="none" stroke="url(#rotateIconGrad)" stroke-width="4"/>
      <circle cx="30" cy="85" r="3.2" fill="url(#rotateIconGrad)"/>
      <linearGradient id="rotateIconGrad" x1="0" y1="0" x2="60" y2="100" gradientUnits="userSpaceOnUse">
        <stop offset="0" stop-color="#62c9f6"/>
        <stop offset="1" stop-color="#b8e7fb"/>
      </linearGradient>
    </svg>
    <p id="rotate-text">Rotate your phone to play</p>
  </div>

  <!-- Off by default -- browsers block autoplay until a real click.
       Fixed to the real viewport corner (not positioned inside .slide's
       own 1920x1080 percentage system), same reason the rotate-prompt
       above is fixed too: .slide's cover/contain scaling shouldn't be
       able to push this out of reach. -->
  <button type="button" class="music-toggle" id="musicToggle" aria-pressed="false" aria-label="Toggle background music">
    <svg class="music-toggle-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path d="M3 9.5V14.5C3 15.0523 3.44772 15.5 4 15.5H7L11.2929 19.7929C11.9229 20.4229 13 19.9749 13 19.0858V4.91421C13 4.02513 11.9229 3.57714 11.2929 4.20711L7 8.5H4C3.44772 8.5 3 8.94772 3 9.5Z" fill="currentColor"/>
      <g class="music-waves">
        <path d="M16.5 8.5C17.5 9.7 18 10.8 18 12C18 13.2 17.5 14.3 16.5 15.5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M19 6C20.5 7.8 21.3 9.8 21.3 12C21.3 14.2 20.5 16.2 19 18" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
      </g>
      <path class="music-mute-x" d="M16.5 9L21 15M21 9L16.5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
    </svg>
  </button>
  <audio id="bgm" src="../assets/bgm.wav" loop preload="none"></audio>

  <!-- Real Fullscreen API, not a CSS trick -- hidden entirely by app.js
       when the browser doesn't expose it at all (mainly iOS Safari; see
       the meta tags in <head> for that platform's own path to a
       chrome-less launch instead, via Add to Home Screen). -->
  <button type="button" class="fullscreen-toggle" id="fullscreenToggle" aria-pressed="false" aria-label="Toggle fullscreen" hidden>
    <svg class="fullscreen-toggle-icon" viewBox="0 0 24 24" fill="none" aria-hidden="true">
      <path class="fullscreen-icon-enter" d="M4 9V5a1 1 0 0 1 1-1h4M20 9V5a1 1 0 0 0-1-1h-4M4 15v4a1 1 0 0 0 1 1h4M20 15v4a1 1 0 0 1-1 1h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
      <path class="fullscreen-icon-exit" d="M9 4H5a1 1 0 0 0-1 1v4M15 4h4a1 1 0 0 1 1 1v4M9 20H5a1 1 0 0 1-1-1v-4M15 20h4a1 1 0 0 0 1-1v-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <main class="stage">
    <div class="top-vignette" aria-hidden="true"></div>

    <section class="slide" aria-label="SEAVENTURE Games">
      <img class="machine" src="../../assets/images/machine.svg?v=2" alt="" draggable="false">
      <img class="logo" src="../../assets/images/logo.svg" alt="Seaventure logo" draggable="false">

      <div class="screen-clip">
        <div class="screen-content" id="screenContent"><!-- current carousel card injected by app.js --></div>
      </div>

      <button type="button" class="joystick-btn joystick-btn--left" id="joyLeft" aria-label="Previous game">
        <img class="joystick-part" src="../../assets/images/joystick-left-base.svg" alt="" draggable="false">
        <img class="joystick-part joystick-top" src="../../assets/images/joystick-left-top.svg" alt="" draggable="false">
      </button>
      <button type="button" class="joystick-btn joystick-btn--right" id="joyRight" aria-label="Next game">
        <img class="joystick-part" src="../../assets/images/joystick-right-base.svg" alt="" draggable="false">
        <img class="joystick-part joystick-top" src="../../assets/images/joystick-right-top.svg" alt="" draggable="false">
      </button>

      <button type="button" class="arcade-button-btn" id="arcadeButton" aria-label="Select / randomize">
        <img class="btn-base" src="../../assets/images/base.svg" alt="" draggable="false">
        <img class="btn-dome" src="../../assets/images/dome.svg" alt="" draggable="false">
      </button>

      <div class="popup-overlay" id="popupOverlay">
        <div class="popup-frame">
          <iframe id="popupIframe" title="Selected game" loading="lazy"></iframe>
          <button type="button" class="popup-close" id="popupClose" aria-label="Close">&times;</button>
        </div>
      </div>
    </section>
  </main>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
  <script src="../page-transition.js?v=2"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
