<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arrange frame</title>

<!-- Same fonts + same style.css as the real landing page (loaded relative
     to this file, which sits next to index.html on purpose) -- this frame
     is not a mockup, it IS the real CSS rendering the real section markup,
     so drag positions read off it are exactly what will end up back in
     style.css. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/rav6zvx.css">
<link rel="stylesheet" href="style.css?v=52">

<style>
  /* This frame only ever renders ONE section, isolated -- no header
     exists above it here, so drop the "content dimmed while
     hamburger open" affordances and just let the section breathe.
     Everything else (colors, type, .deco placement) still comes
     straight from style.css above, untouched. */
  html, body { overflow-x: hidden; }

  .deco {
    cursor: grab;
    touch-action: none; /* we handle the drag ourselves, don't let the
                            browser also try to pan/scroll on touch */
  }
  .deco.is-dragging { cursor: grabbing; }
  .deco:hover, .deco.is-dragging {
    outline: 2px dashed #ff5c5c;
    outline-offset: 3px;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="deco-bubble-cluster" viewBox="0 0 207 204">
      <path opacity="0.1" d="M26.891 124.047C12.7747 77.7459 35.0525 49.6528 57.903 35.5557C62.5047 32.7168 66.3402 38.7008 63.0144 42.9639C39.2566 73.4173 32.4667 112.902 29.3872 124.295C28.8274 126.366 27.5167 126.099 26.891 124.047Z" fill="#BBE8FB"/>
      <ellipse opacity="0.1" cx="83" cy="28" rx="9" ry="8" fill="#BBE8FB"/>
      <ellipse opacity="0.1" cx="103.5" cy="102" rx="103.5" ry="102" fill="#BBE8FB"/>
    </symbol>
    <symbol id="deco-fish-1" viewBox="0 0 176 122">
      <path d="M4.359 102.549C-20.7183 48.2975 68.5127 27.3879 116.263 23.7146C185.023 -19.2348 163.339 5.819 143.902 23.7146C210.774 51.7447 157.833 44.2474 123.004 36.995C21.2117 39.2555 35.7056 170.364 4.359 102.549Z" fill="#042549"/>
    </symbol>
    <symbol id="deco-fish-2" viewBox="0 0 125 124">
      <path d="M10.0942 120.655C-9.56338 112.244 -6.563 59.5342 74.6955 28.8156C135.35 -23.3723 125.034 7.07068 112.294 28.8156C142.373 62.3442 109.332 52.9902 89.0514 44.1221C37.4365 67.5342 53.0251 139.022 10.0942 120.655Z" fill="#042549"/>
    </symbol>
    <symbol id="deco-fish-3" viewBox="0 0 203 263">
      <path d="M13.1364 249.455C-18.1736 192.71 2.94722 124.5 115.035 73.2152C174.27 -51.4149 168.159 10.8421 157.699 57.5494C249.654 81.5703 178.854 93.3776 131.959 96.2787C33.4473 169 44.4464 306.2 13.1364 249.455Z" fill="#042549"/>
    </symbol>
    <symbol id="deco-fish-4" viewBox="0 0 96 36">
      <path d="M8.88767 14.5535C25.8091 -3.42513 48.512 1.5163 60.7694 7.61164C62.6722 8.55788 65.1827 7.45346 66.5676 5.82439C71.1449 0.440479 82.1608 -0.394834 90.6188 0.137091C93.9666 0.347634 96.639 3.39709 94.6001 6.04423C93.4961 7.47754 91.9482 8.65292 90.1921 9.60554C87.3651 11.1391 85.9416 18.1587 87.9623 20.5747C89.0155 21.834 89.9162 23.1336 90.6778 24.413C92.9847 28.2886 89.4464 32.4118 85.1174 30.9315C79.658 29.0647 75.3454 25.9604 72.3619 23.067C69.6424 20.4297 66.221 18.3065 62.3931 18.8032C58.4846 19.3104 53.841 20.2656 49.1452 21.247C37.1837 24.7821 27.5649 29.0592 21.1976 33.4282C15.6186 37.2563 -14.7515 39.6697 8.88767 14.5535Z" fill="#042549"/>
    </symbol>
  </defs>
</svg>

<main id="sectionMount"><!-- one <section> injected by script below --></main>

<script>
  // Verbatim copies of the 6 decorated sections from landing/index.html --
  // same classes, same nesting, so every rule in style.css (including the
  // .sdg >=1400px bleed override) applies exactly as it does on the real
  // page. Static copy text/example only -- this frame never ships, so it
  // doesn't need to track edits to the real copy, only the .deco markup.
  const SECTIONS = {
    intro: `
      <section class="intro">
        <svg class="deco deco-bubble" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".intro .deco-bubble"><title>.intro .deco-bubble</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-bubble deco-bubble--mini deco-bubble--intro-mini" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".intro .deco-bubble--intro-mini"><title>.intro .deco-bubble--intro-mini</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-fish deco-fish--2" viewBox="0 0 125 124" aria-hidden="true" data-deco-id=".intro .deco-fish--2"><title>.intro .deco-fish--2</title><use href="#deco-fish-2"/></svg>
        <p class="intro-text">N5CC (Ngã 5 Chuồng Chó) is a team of five - Hồ Kiều Phương, Tiêu Dĩnh Ngọc, Trần Tùng Phương, Phạm Hoài An, and Trịnh Tuấn Hưng. Together, we created Seaventure, a website and interactive games exploring different goals of SDG 14: Life Below Water.</p>
      </section>`,
    sdg: `
      <section class="sdg">
        <svg class="deco deco-bubble deco-bubble--sdg-tl" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".sdg .deco-bubble--sdg-tl"><title>.sdg .deco-bubble--sdg-tl</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-bubble deco-bubble--mini deco-bubble--sdg-tl-mini" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".sdg .deco-bubble--sdg-tl-mini"><title>.sdg .deco-bubble--sdg-tl-mini</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-fish deco-fish--sdg-a" viewBox="0 0 176 122" aria-hidden="true" data-deco-id=".sdg .deco-fish--sdg-a"><title>.sdg .deco-fish--sdg-a</title><use href="#deco-fish-1"/></svg>
        <svg class="deco deco-fish deco-fish--sdg-b" viewBox="0 0 96 36" aria-hidden="true" data-deco-id=".sdg .deco-fish--sdg-b"><title>.sdg .deco-fish--sdg-b</title><use href="#deco-fish-4"/></svg>
        <svg class="deco deco-fish deco-fish--sdg-e" viewBox="0 0 203 263" aria-hidden="true" data-deco-id=".sdg .deco-fish--sdg-e"><title>.sdg .deco-fish--sdg-e</title><use href="#deco-fish-3"/></svg>
        <svg class="deco deco-fish deco-fish--sdg-f" viewBox="0 0 125 124" aria-hidden="true" data-deco-id=".sdg .deco-fish--sdg-f"><title>.sdg .deco-fish--sdg-f</title><use href="#deco-fish-2"/></svg>
        <svg class="deco deco-bubble deco-bubble--sdg-br" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".sdg .deco-bubble--sdg-br"><title>.sdg .deco-bubble--sdg-br</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-bubble deco-bubble--mini deco-bubble--sdg-br-mini" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".sdg .deco-bubble--sdg-br-mini"><title>.sdg .deco-bubble--sdg-br-mini</title><use href="#deco-bubble-cluster"/></svg>
        <h2 class="sdg-title">SDG 14:<br>Life Below Water</h2>
        <p class="sdg-desc">This project focuses on <span class="hl">Sustainable Development Goal 14: Life Below Water</span>, aiming to raise awareness among Generation Z about protecting marine environments. This project aims to highlights how everyday actions can impact oceans and marine ecosystems, encouraging young people to make more sustainable choices.</p>
      </section>`,
    quote: `
      <section class="quote">
        <svg class="deco deco-bubble deco-bubble--quote" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".quote .deco-bubble--quote"><title>.quote .deco-bubble--quote</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-bubble deco-bubble--mini deco-bubble--quote-mini" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".quote .deco-bubble--quote-mini"><title>.quote .deco-bubble--quote-mini</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-fish deco-fish--quote-a" viewBox="0 0 96 36" aria-hidden="true" data-deco-id=".quote .deco-fish--quote-a"><title>.quote .deco-fish--quote-a</title><use href="#deco-fish-4"/></svg>
        <svg class="deco deco-fish deco-fish--quote-b" viewBox="0 0 96 36" aria-hidden="true" data-deco-id=".quote .deco-fish--quote-b"><title>.quote .deco-fish--quote-b</title><use href="#deco-fish-4"/></svg>
        <p class="quote-text">&ldquo;The greatest threat to our planet is the belief that someone else will save it&rdquo;</p>
        <p class="quote-author">Robert Swan</p>
      </section>`,
    cta: `
      <section class="cta-section">
        <svg class="deco deco-fish deco-fish--cta-a" viewBox="0 0 96 36" aria-hidden="true" data-deco-id=".cta-section .deco-fish--cta-a"><title>.cta-section .deco-fish--cta-a</title><use href="#deco-fish-4"/></svg>
        <svg class="deco deco-fish deco-fish--cta-b" viewBox="0 0 96 36" aria-hidden="true" data-deco-id=".cta-section .deco-fish--cta-b"><title>.cta-section .deco-fish--cta-b</title><use href="#deco-fish-4"/></svg>
        <div class="quote-hands-wrap">
          <img class="quote-hand quote-hand--upper" src="assets/hand-upper-light.png" alt="" aria-hidden="true">
          <img class="quote-hand quote-hand--bottom" src="assets/hand-bottom-light.png" alt="" aria-hidden="true">
          <p class="cta">Change everyday habits to protect ocean health</p>
        </div>
      </section>`,
    explainer: `
      <section class="explainer">
        <svg class="deco deco-bubble deco-bubble--explainer" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".explainer .deco-bubble--explainer"><title>.explainer .deco-bubble--explainer</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-bubble deco-bubble--mini deco-bubble--explainer-mini" viewBox="0 0 207 204" aria-hidden="true" data-deco-id=".explainer .deco-bubble--explainer-mini"><title>.explainer .deco-bubble--explainer-mini</title><use href="#deco-bubble-cluster"/></svg>
        <svg class="deco deco-fish" viewBox="0 0 176 122" aria-hidden="true" data-deco-id=".explainer .deco-fish"><title>.explainer .deco-fish</title><use href="#deco-fish-1"/></svg>
        <p class="explainer-text"><span class="hl">&ldquo;The greatest threat to our planet is the belief that someone else will save it&rdquo;</span> reminds us that protecting the ocean starts with individual action. SDG 14 addresses issues such as pollution, overfishing, ocean acidification, and ecosystem loss, all of which are affected by our everyday choices. Small changes in how we consume, use resources, and manage waste can collectively make a difference. <span class="hl">Change everyday habits to protect ocean health.</span></p>
      </section>`,
    games: `
      <section class="games">
        <svg class="deco deco-fish deco-fish--games-a" viewBox="0 0 125 124" aria-hidden="true" data-deco-id=".games .deco-fish--games-a"><title>.games .deco-fish--games-a</title><use href="#deco-fish-2"/></svg>
        <svg class="deco deco-fish deco-fish--games-b" viewBox="0 0 96 36" aria-hidden="true" data-deco-id=".games .deco-fish--games-b"><title>.games .deco-fish--games-b</title><use href="#deco-fish-4"/></svg>
        <img class="games-machine" src="assets/arcade-light.png" alt="Arcade cabinet">
        <div class="games-copy">
          <h2 class="games-heading">Explore games inspired by <span class="hl">SDG 14: Life Below Water</span></h2>
          <p class="games-desc">Each game focuses on a different goal for protecting our ocean, and make sure you check CREDIT of each game to learn more about them.</p>
          <p class="games-hint">Press START to random game</p>
          <a class="start-btn" href="#" onclick="return false">START</a>
        </div>
      </section>`
  };

  const key = new URLSearchParams(location.search).get('section');
  document.getElementById('sectionMount').innerHTML = SECTIONS[key] || '<p style="padding:20px">Unknown section: ' + key + '</p>';

  const section = document.querySelector('#sectionMount > section');
  const decos = Array.from(document.querySelectorAll('.deco'));

  // Baseline = the position style.css itself produced, read back from
  // actual layout (getBoundingClientRect) so it doesn't matter whether
  // the original rule anchored with top/left, bottom/left, top/right or
  // bottom/right -- the rendered box is the same starting point either
  // way. Captured once, used both as the "as-is" export before any drag
  // and to power the per-element Reset (double-click).
  function readPercent(el) {
    const dr = el.getBoundingClientRect();
    const sr = section.getBoundingClientRect();
    return {
      left: ((dr.left - sr.left) / sr.width) * 100,
      top: ((dr.top - sr.top) / sr.height) * 100
    };
  }

  const baseline = new Map();
  decos.forEach((el) => baseline.set(el, readPercent(el)));

  function applyPercent(el, left, top) {
    el.style.left = left.toFixed(2) + '%';
    el.style.top = top.toFixed(2) + '%';
    el.style.right = 'auto';
    el.style.bottom = 'auto';
  }

  // Bake the read-back baseline into inline styles immediately so the
  // element's visual position doesn't jump when the first drag starts
  // (top/left replacing whatever mix of edges the stylesheet used).
  decos.forEach((el) => {
    const p = baseline.get(el);
    applyPercent(el, p.left, p.top);
  });

  // -- drag --
  let dragEl = null;
  let dragStartPointer = null;
  let dragStartPercent = null;

  decos.forEach((el) => {
    el.addEventListener('pointerdown', (e) => {
      dragEl = el;
      dragEl.classList.add('is-dragging');
      dragEl.setPointerCapture(e.pointerId);
      dragStartPointer = { x: e.clientX, y: e.clientY };
      dragStartPercent = {
        left: parseFloat(el.style.left),
        top: parseFloat(el.style.top)
      };
      e.preventDefault();
    });
    el.addEventListener('dblclick', () => {
      const p = baseline.get(el);
      applyPercent(el, p.left, p.top);
    });
  });

  window.addEventListener('pointermove', (e) => {
    if (!dragEl) return;
    const sr = section.getBoundingClientRect();
    const dxPct = ((e.clientX - dragStartPointer.x) / sr.width) * 100;
    const dyPct = ((e.clientY - dragStartPointer.y) / sr.height) * 100;
    applyPercent(dragEl, dragStartPercent.left + dxPct, dragStartPercent.top + dyPct);
  });

  window.addEventListener('pointerup', () => {
    if (dragEl) dragEl.classList.remove('is-dragging');
    dragEl = null;
  });

  // -- talk to the parent tool page (works across file:// too, unlike
  // reaching into contentWindow.document directly, which some browsers
  // block between file:// documents even when they're "the same origin") --
  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'export-request') {
      const positions = {};
      decos.forEach((el) => {
        positions[el.dataset.decoId] = {
          left: el.style.left,
          top: el.style.top
        };
      });
      window.parent.postMessage({ type: 'export-response', requestId: e.data.requestId, positions }, '*');
    }
    if (e.data.type === 'reset-all') {
      decos.forEach((el) => {
        const p = baseline.get(el);
        applyPercent(el, p.left, p.top);
      });
    }
  });
</script>
</body>
</html>
