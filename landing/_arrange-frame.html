<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>arrange frame</title>

<!-- Same fonts + same style.css as the real landing page (loaded relative
     to this file, which sits next to index.html on purpose) -- this frame
     is not a mockup, it IS the real CSS rendering the real section markup,
     so drag/size/rotation values read off it are exactly what will end
     up back in the real page. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Alata&family=Inter:wght@900&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://use.typekit.net/rav6zvx.css">
<link rel="stylesheet" href="style.css?v=53">

<style>
  html, body { overflow-x: hidden; }
  /* Without an actual <header> here, --header-h's "leave 104px for it"
     math (baked into every section's min-height AND body's own) left
     body's own rendered box shorter than this frame's real iframe
     height -- the gradient stopped short and the browser's default
     canvas color showed through as a flat strip. Stretching html/body
     to the full frame lets the same gradient reach the bottom edge. */
  html, body { height: 100%; }

  /* Everything on screen here comes from the item list the parent tool
     page drives via postMessage -- add/select/edit/delete all happen in
     the parent's palette + inspector panel (outside this iframe, so the
     real section preview stays uncluttered by tool chrome); this frame
     only renders items and reports drag + click-select back up. Colors
     are NOT customizable -- per feedback, every fish/bubble keeps its
     own original fill+opacity exactly as authored in the symbol defs
     below (same RGBA as the real site used), no shared/overridable
     color variable. */

  .deco-item {
    position: absolute;
    cursor: grab;
    user-select: none;
    -webkit-user-select: none;
    /* Always-on faint guide box -- purely a tool aid so a low-opacity
       bubble (0.1 alpha in its own defs, intentionally subtle on the
       real page) can still be found and grabbed while editing. This
       outline is tool-only chrome, never part of the exported item
       data, so it has no effect on how the piece will actually look
       once placed back on the real page. */
    outline: 1px dashed rgba(120, 120, 120, 0.35);
    outline-offset: 3px;
  }
  .deco-item.is-dragging { cursor: grabbing; }
  .deco-item svg {
    display: block;
    width: 100%;
    height: auto;
    pointer-events: all; /* SVG default hit-testing only counts painted
                             pixels -- these shapes have a lot of
                             transparent space in their own box, so the
                             whole box needs to count instead */
  }
  .deco-item:hover { outline: 2px dashed rgba(255, 92, 92, 0.6); outline-offset: 4px; }
  .deco-item.is-selected, .deco-item.is-dragging {
    outline: 2px solid #ff5c5c;
    outline-offset: 4px;
  }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <symbol id="deco-bubble-cluster" viewBox="0 0 207 204">
      <path opacity="0.1" d="M26.891 124.047C12.7747 77.7459 35.0525 49.6528 57.903 35.5557C62.5047 32.7168 66.3402 38.7008 63.0144 42.9639C39.2566 73.4173 32.4667 112.902 29.3872 124.295C28.8274 126.366 27.5167 126.099 26.891 124.047Z" fill="#BBE8FB"/>
      <ellipse opacity="0.1" cx="83" cy="28" rx="9" ry="8" fill="#BBE8FB"/>
      <ellipse opacity="0.1" cx="103.5" cy="102" rx="103.5" ry="102" fill="#BBE8FB"/>
    </symbol>
    <symbol id="deco-fish-1" viewBox="0 0 176 122">
      <path d="M4.359 102.549C-20.7183 48.2975 68.5127 27.3879 116.263 23.7146C185.023 -19.2348 163.339 5.819 143.902 23.7146C210.774 51.7447 157.833 44.2474 123.004 36.995C21.2117 39.2555 35.7056 170.364 4.359 102.549Z" fill="#042549"/>
    </symbol>
    <symbol id="deco-fish-2" viewBox="0 0 125 124">
      <path d="M10.0942 120.655C-9.56338 112.244 -6.563 59.5342 74.6955 28.8156C135.35 -23.3723 125.034 7.07068 112.294 28.8156C142.373 62.3442 109.332 52.9902 89.0514 44.1221C37.4365 67.5342 53.0251 139.022 10.0942 120.655Z" fill="#042549"/>
    </symbol>
    <symbol id="deco-fish-3" viewBox="0 0 203 263">
      <path d="M13.1364 249.455C-18.1736 192.71 2.94722 124.5 115.035 73.2152C174.27 -51.4149 168.159 10.8421 157.699 57.5494C249.654 81.5703 178.854 93.3776 131.959 96.2787C33.4473 169 44.4464 306.2 13.1364 249.455Z" fill="#042549"/>
    </symbol>
    <symbol id="deco-fish-4" viewBox="0 0 96 36">
      <path d="M8.88767 14.5535C25.8091 -3.42513 48.512 1.5163 60.7694 7.61164C62.6722 8.55788 65.1827 7.45346 66.5676 5.82439C71.1449 0.440479 82.1608 -0.394834 90.6188 0.137091C93.9666 0.347634 96.639 3.39709 94.6001 6.04423C93.4961 7.47754 91.9482 8.65292 90.1921 9.60554C87.3651 11.1391 85.9416 18.1587 87.9623 20.5747C89.0155 21.834 89.9162 23.1336 90.6778 24.413C92.9847 28.2886 89.4464 32.4118 85.1174 30.9315C79.658 29.0647 75.3454 25.9604 72.3619 23.067C69.6424 20.4297 66.221 18.3065 62.3931 18.8032C58.4846 19.3104 53.841 20.2656 49.1452 21.247C37.1837 24.7821 27.5649 29.0592 21.1976 33.4282C15.6186 37.2563 -14.7515 39.6697 8.88767 14.5535Z" fill="#042549"/>
    </symbol>
  </defs>
</svg>

<main id="sectionMount"><!-- one <section> injected by script below --></main>

<script>
  // Verbatim copies of the 6 sections from landing/index.html, minus every
  // .deco-fish/.deco-bubble svg -- those are gone from the real page too
  // (per feedback: start the arrangement over from scratch instead of
  // editing the old hand-placed set).
  const SECTIONS = {
    intro: `
      <section class="intro">
        <p class="intro-text">N5CC (Ngã 5 Chuồng Chó) is a team of five - Hồ Kiều Phương, Tiêu Dĩnh Ngọc, Trần Tùng Phương, Phạm Hoài An, and Trịnh Tuấn Hưng. Together, we created Seaventure, a website and interactive games exploring different goals of SDG 14: Life Below Water.</p>
      </section>`,
    sdg: `
      <section class="sdg">
        <h2 class="sdg-title">SDG 14:<br>Life Below Water</h2>
        <p class="sdg-desc">This project focuses on <span class="hl">Sustainable Development Goal 14: Life Below Water</span>, aiming to raise awareness among Generation Z about protecting marine environments. This project aims to highlights how everyday actions can impact oceans and marine ecosystems, encouraging young people to make more sustainable choices.</p>
      </section>`,
    quote: `
      <section class="quote">
        <p class="quote-text">&ldquo;The greatest threat to our planet is the belief that someone else will save it&rdquo;</p>
        <p class="quote-author">Robert Swan</p>
      </section>`,
    cta: `
      <section class="cta-section">
        <div class="quote-hands-wrap">
          <img class="quote-hand quote-hand--upper" src="assets/hand-upper-light.png" alt="" aria-hidden="true">
          <img class="quote-hand quote-hand--bottom" src="assets/hand-bottom-light.png" alt="" aria-hidden="true">
          <p class="cta">Change everyday habits to protect ocean health</p>
        </div>
      </section>`,
    explainer: `
      <section class="explainer">
        <p class="explainer-text"><span class="hl">&ldquo;The greatest threat to our planet is the belief that someone else will save it&rdquo;</span> reminds us that protecting the ocean starts with individual action. SDG 14 addresses issues such as pollution, overfishing, ocean acidification, and ecosystem loss, all of which are affected by our everyday choices. Small changes in how we consume, use resources, and manage waste can collectively make a difference. <span class="hl">Change everyday habits to protect ocean health.</span></p>
      </section>`,
    games: `
      <section class="games">
        <img class="games-machine" src="assets/arcade-light.png" alt="Arcade cabinet">
        <div class="games-copy">
          <h2 class="games-heading">Explore games inspired by <span class="hl">SDG 14: Life Below Water</span></h2>
          <p class="games-desc">Each game focuses on a different goal for protecting our ocean, and make sure you check CREDIT of each game to learn more about them.</p>
          <p class="games-hint">Press START to random game</p>
          <a class="start-btn" href="#" onclick="return false">START</a>
        </div>
      </section>`
  };

  // type -> which <symbol> it renders + its own viewBox (for correct
  // aspect ratio) + the size a freshly-added instance starts at.
  const TYPE_INFO = {
    'bubble':      { symbol: 'deco-bubble-cluster', viewBox: '0 0 207 204', defaultSize: 70 },
    'bubble-mini': { symbol: 'deco-bubble-cluster', viewBox: '0 0 207 204', defaultSize: 36 },
    'fish-1':      { symbol: 'deco-fish-1', viewBox: '0 0 176 122', defaultSize: 56 },
    'fish-2':      { symbol: 'deco-fish-2', viewBox: '0 0 125 124', defaultSize: 56 },
    'fish-3':      { symbol: 'deco-fish-3', viewBox: '0 0 203 263', defaultSize: 56 },
    'fish-4':      { symbol: 'deco-fish-4', viewBox: '0 0 96 36',   defaultSize: 56 }
  };

  const key = new URLSearchParams(location.search).get('section');
  document.getElementById('sectionMount').innerHTML = SECTIONS[key] || '<p style="padding:20px">Unknown section: ' + key + '</p>';
  const section = document.querySelector('#sectionMount > section');

  let items = []; // { id, type, x, y (center %), size (px), rotation (deg), mirror (bool) }
  let nextId = 1;
  let selectedId = null;

  function findItem(id) { return items.filter((it) => it.id === id)[0] || null; }

  function notifySelection() {
    const item = findItem(selectedId);
    window.parent.postMessage({ type: 'selection-changed', id: selectedId, item }, '*');
  }

  function render() {
    section.querySelectorAll('.deco-item').forEach((el) => el.remove());
    items.forEach((item) => {
      const info = TYPE_INFO[item.type];
      const el = document.createElement('div');
      el.className = 'deco-item' + (item.id === selectedId ? ' is-selected' : '');
      el.dataset.id = item.id;
      el.style.left = item.x + '%';
      el.style.top = item.y + '%';
      el.style.width = item.size + 'px';
      el.style.transform = 'translate(-50%, -50%) rotate(' + item.rotation + 'deg)' + (item.mirror ? ' scaleX(-1)' : '');

      const svgNS = 'http://www.w3.org/2000/svg';
      const svg = document.createElementNS(svgNS, 'svg');
      svg.setAttribute('viewBox', info.viewBox);
      svg.setAttribute('aria-hidden', 'true');
      const use = document.createElementNS(svgNS, 'use');
      use.setAttribute('href', '#' + info.symbol);
      svg.appendChild(use);
      el.appendChild(svg);

      el.addEventListener('pointerdown', (e) => {
        selectedId = item.id;
        render();
        notifySelection();
        dragItem = item;
        dragEl = el;
        el.classList.add('is-dragging');
        el.setPointerCapture(e.pointerId);
        dragStartPointer = { x: e.clientX, y: e.clientY };
        dragStartPos = { x: item.x, y: item.y };
        e.preventDefault();
      });

      section.appendChild(el);
    });
  }

  let dragItem = null, dragEl = null, dragStartPointer = null, dragStartPos = null;

  window.addEventListener('pointermove', (e) => {
    if (!dragItem) return;
    const sr = section.getBoundingClientRect();
    const dxPct = ((e.clientX - dragStartPointer.x) / sr.width) * 100;
    const dyPct = ((e.clientY - dragStartPointer.y) / sr.height) * 100;
    dragItem.x = dragStartPos.x + dxPct;
    dragItem.y = dragStartPos.y + dyPct;
    dragEl.style.left = dragItem.x + '%';
    dragEl.style.top = dragItem.y + '%';
    notifySelection();
  });
  window.addEventListener('pointerup', () => {
    if (dragEl) dragEl.classList.remove('is-dragging');
    dragItem = null; dragEl = null;
  });

  // Clicking empty section background deselects.
  section.addEventListener('pointerdown', (e) => {
    if (e.target === section) { selectedId = null; render(); notifySelection(); }
  });

  function addItem(type) {
    const info = TYPE_INFO[type];
    if (!info) return;
    const item = {
      id: nextId++,
      type,
      x: 50 + (Math.random() * 20 - 10),
      y: 50 + (Math.random() * 20 - 10),
      size: info.defaultSize,
      rotation: Math.round(Math.random() * 20 - 10),
      mirror: false
    };
    items.push(item);
    selectedId = item.id;
    render();
    notifySelection();
  }

  window.addEventListener('message', (e) => {
    if (!e.data) return;
    if (e.data.type === 'add-item') addItem(e.data.itemType);
    if (e.data.type === 'clear-items') { items = []; selectedId = null; render(); notifySelection(); }
    if (e.data.type === 'delete-item') {
      items = items.filter((it) => it.id !== e.data.id);
      if (selectedId === e.data.id) selectedId = null;
      render();
      notifySelection();
    }
    if (e.data.type === 'update-item') {
      const item = findItem(e.data.id);
      if (item) {
        Object.assign(item, e.data.patch);
        render();
        notifySelection();
      }
    }
    if (e.data.type === 'export-request') {
      window.parent.postMessage({
        type: 'export-response',
        requestId: e.data.requestId,
        items: items.map(({ id, ...rest }) => rest)
      }, '*');
    }
  });

  render();
</script>
</body>
</html>
